# Leonardo's professional profile: the single source of truth for the profile card,
# the cards in the chat and the assistant's core context (ADR-007, ADR-015).
#
# Public file: never add a phone number, email address, salary or start date (ADR-012).
# The site shows the phone number from deployment configuration, never from here (ADR-016).
# Every text a visitor can read has an English (en) and a Spanish (es) version.
# Dates are "YYYY-MM", or "YYYY" when the month isn't known; `end: null` means present.

basics:
  name: Leonardo Mannanice
  photo:
    path: assets/profile-photo.jpg
    alt:
      en: Portrait of Leonardo Mannanice
      es: Retrato de Leonardo Mannanice
  headline:
    en: AI Engineer · Full Stack Developer
    es: AI Engineer · Desarrollador Full Stack
  focus:
    en: RAG, AI agents and voice AI · Python, Laravel, React
    es: RAG, agentes y voz con IA · Python, Laravel, React
  location:
    en: Argentina
