summary:
  en: >-
    AI engineer and full stack developer with 10+ years building web platforms, SaaS and
    e-commerce, focused since 2023 on shipping AI into real products: RAG systems, AI agents,
    LLM data pipelines and real-time voice and video avatars.

    Currently developing AI products at Simbel IA Studio and doing AI R&D at Universidad
    Tecnológica Nacional. Lead developer of ServiME, an AI digital menu SaaS in production.
    Former project leader of an 8-developer team and certified teacher, used to turning
    business needs into working systems and explaining trade-offs to non-technical people.
  es: >-
    AI Engineer y desarrollador full stack con más de 10 años construyendo plataformas web,
    SaaS y e-commerce, enfocado desde 2023 en llevar la IA a productos reales: sistemas RAG,
    agentes de IA, pipelines de datos con LLMs y avatares de voz y video en tiempo real.

    Hoy desarrolla productos de IA en Simbel IA Studio y hace I+D en IA en la Universidad
    Tecnológica Nacional. Desarrollador principal de ServiME, un SaaS de menú digital con IA
    en producción. Fue líder de proyecto de un equipo de 8 desarrolladores y es profesor de
    educación: está acostumbrado a convertir necesidades de negocio en sistemas que funcionan
    y a explicar decisiones técnicas a perfiles no técnicos.

